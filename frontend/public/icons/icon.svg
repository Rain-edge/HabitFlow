<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="HabitFlow">
  <defs>
    <linearGradient id="hfBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FB1A0"/>
      <stop offset="1" stop-color="#139384"/>
    </linearGradient>
  </defs>
  <!-- squircle background -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#hfBg)"/>
  <!-- ascending flow: the daily trajectory, drawn as one calm rising stroke -->
  <path d="M 110 358 C 180 358, 170 260, 238 250 C 300 241, 292 186, 342 176"
        fill="none" stroke="#FBFEFD" stroke-width="46" stroke-linecap="round"/>
  <!-- the bud at the tip: growth / becoming -->
  <circle cx="374" cy="162" r="30" fill="#FBFEFD"/>
</svg>
